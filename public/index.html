<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRAUS MUSIC TV</title><style> :root{font-family:Inter,system-ui,Arial,sans-serif;color:#f4f8ff;background:#09111f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#193653,#09111f 65%);min-height:100vh}.wrap{max-width:1480px;margin:auto;padding:26px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-weight:900;font-size:clamp(25px,3.5vw,43px)}.brand b{color:#57e8c6}.sub{color:#9bb3ca;margin:4px 0 24px}.inputbar{display:flex;gap:12px;flex-wrap:wrap;padding:18px;border:1px solid #2b4561;background:#132238;border-radius:18px}input{flex:1;min-width:220px;background:#081322;border:1px solid #3c5876;color:white;border-radius:10px;padding:16px;font-size:17px}button{background:#51dfbb;color:#09251e;font-size:16px;font-weight:900;border:0;border-radius:10px;padding:15px 25px;cursor:pointer}button.secondary{background:#213c57;color:#d5e6fa}button:disabled{opacity:.5;cursor:wait}.meta{margin:24px 0;color:#b7c8dc}.meta strong{color:white}.status{color:#ffcb86;min-height:24px}.section{background:#132238;border:1px solid #2a405a;border-radius:17px;padding:22px;margin:18px 0}.section h2{font-size:clamp(18px,2.4vw,30px);margin:0 0 18px;color:#f8faff}.line{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.chord{background:#203b55;border-radius:10px;padding:12px 18px;color:#60f1cb;font-size:clamp(24px,3.4vw,53px);font-weight:850}.warning{color:#a9b9cb;font-size:13px;line-height:1.6;margin-top:18px}.source{color:#77dbff;word-break:break-all}.empty{padding:50px 15px;text-align:center;color:#93aac1}.fullscreen .inputbar,.fullscreen .sub,.fullscreen .warning,.fullscreen .source{display:none}.fullscreen .chord{font-size:clamp(32px,5vw,80px)}@media(max-width:600px){.wrap{padding:14px}.inputbar{padding:12px}button{flex:1}} </style></head><body><main class="wrap" id="app"><header class="top"><div class="brand">GRAUS <b>MUSIC</b> TV</div><button class="secondary" id="tv">⛶ MODO TV</button></header><div class="sub">Cole o link do YouTube e gere a sequência harmônica em graus — sem letras.</div><form class="inputbar" id="form"><input type="url" id="url" required placeholder="Cole o link do YouTube aqui" aria-label="Link do YouTube"><button id="generate" type="submit">♫ GERAR</button></form><div class="meta" id="meta"></div><div class="status" role="status" id="status"></div><div id="result"><div class="empty">Aguardando o link da música.</div></div><div class="warning" id="warning"></div></main><script> const $=id=>document.getElementById(id);const app=$('app'); $('tv').onclick=async()=>{if(!document.fullscreenElement){try{await app.requestFullscreen()}catch{}app.classList.add('fullscreen');$('tv').textContent='SAIR DO MODO TV'}else{await document.exitFullscreen();app.classList.remove('fullscreen');$('tv').textContent='⛶ MODO TV'}}; document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){app.classList.remove('fullscreen');$('tv').textContent='⛶ MODO TV'}}); $('form').onsubmit=async e=>{e.preventDefault();$('generate').disabled=true;$('status').textContent='Identificando vídeo, pesquisando cifras e convertendo acordes…';$('result').replaceChildren();$('meta').textContent='';$('warning').textContent='';try{let r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('url').value.trim()})});let d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível gerar.');$('status').textContent='';let heading=document.createElement('strong');heading.textContent=d.title+' • Tom estimado: '+d.key;$('meta').append(heading);for(let s of d.sections){let section=document.createElement('section');section.className='section';let h=document.createElement('h2');h.textContent=s.name;section.append(h);for(let line of s.lines){let row=document.createElement('div');row.className='line';for(let chord of line){let span=document.createElement('span');span.className='chord';span.textContent=chord;row.append(span)}section.append(row)}$('result').append(section)}let a=document.createElement('a');a.href=d.source;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Fonte da cifra';a.className='source';$('warning').textContent=d.warning+' ';$('warning').append(a)}catch(err){$('status').textContent=err.message;$('result').innerHTML='<div class="empty">Nenhuma cifra gerada.</div>'}finally{$('generate').disabled=false}}; </script></body></html>
